#
# 50M cooldown experiment on LUMI.
#

###############################################################
# AUTOEXP.
# Special variables used by autoexp.

autoexp:

    # Helpers and cluster setup script.
    oellm_folder: "/scratch/project_462000963/users/niccolo/autoexperiment/oellm"
    helpers: "{oellm_folder}/helpers"
    cluster: "{oellm_folder}/cluster"

    # Output folder. For this example we write in this folder.
    out_folder: "/scratch/project_462000963/users/niccolo/oellm_scaling"
    logs: "{out_folder}/logs"
    ckpts: "{out_folder}/ckpts"
    scripts: "{out_folder}/sbatch"

    # Templated sbatch.
    template: "/scratch/project_462000963/users/niccolo/autoexperiment/scripts/dense/debug/train.sbatch"

    # Destination for sbatch script and command to execute.
    sbatch_script: "{scripts}/{name}.sbatch"
    cmd: "sbatch {sbatch_script}"

    # Termination cmd.
    termination_cmd: "{helpers}/finished_train.py {logs} {slurm.job_name}"

###############################################################
# TEMPLATE ARGS.
# Placeholders in the templated sbatch.

slurm:

    job_name: "{autoexp.name}"
    out_dir: "{autoexp.logs}"
    ckpt_dir: "{autoexp.ckpts}"

    account: "project_462000963"

    cluster_setup_script: "{autoexp.cluster}/setup_lumi.sh"

###############################################################
# MEGATRON ARGS.
# These args are concatenated and passed verbatim to Megatron-LM.

args:

    # wandb name
    wandb_exp_name: "{autoexp.name}"
    wandb_project: "debug"

    # DATA
    mock_data: True
    seq_length: 4096
    max_position_embeddings: 4096
    tokenizer_model: EleutherAI/gpt-neox-20b
    tokenizer_type: HuggingFaceTokenizer
    num_workers: 7
    num-dataset-builder-threads: 6 # lumi-specific
    split: '99,1,0'

    # MODEL
    num_layers: 12
    hidden_size: 384
    ffn_hidden_size: 1536
    num_attention_heads: 6
    init_method_std: 0.02
    position_embedding_type: "rope"
    rotary_base: 10000
    rotary_percent: 1.0
    group_query_attentions: False
    num_query_groups: 6 # no gqa when NUM_QUERY_GROUPS==NUM_ATTENTION_HEADS TODO: check
    attention_dropout: 0.0
    hidden_dropout: 0.0
    normalization: RMSNorm
    norm_epsilon: 1.e-5 # rmsnorm epsilon
    qk_layernorm: True # potentially enable qk-norm
    bf16: True
    swiglu: True
    untie_embeddings_and_output_weights: False
    use_flash_attn: True
    attention_softmax_in_fp32: False # OpenSci style
    disable_bias_linear: False

    # TRAINING, PARALLELISM
    recompute_activations: False
    use_torch_fsdp2: False # it's either this or the next 4 args
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: True

    distributed_backend: nccl
    distributed_timeout_minutes: 10

    # DISTRIBUTED OPTIM
    use_distributed_optimizer: False

    # OPTIMIZER
    optimizer: adam
    adam_beta1: 0.9
    adam_beta2: 0.99
    adam_eps: 1.e-8
    clip_grad: 1.0
    weight_decay: 0.1

    # SCHEDULER
    min_lr: 0.0
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_warmup_iters: 1000 # For now we fix it to 1k

    # PROFILE
    profile: False
    use_pytorch_profiler: False
    profile_ranks: [0]
    profile_step_start: 5
    profile_step_end: 12

    # EVALS
    eval_interval: 1000
    eval_iters: 5000

    # LOGGING
    log_interval: 1
    log_progress: True
    log_throughput: True

    # Set CHECKPOINT_FORMAT
    ckpt_format: "torch"
    save_interval: 5000

    # LUMI-specific configs
    te-fallback-layernorm-linear: True 
    no-bias-swiglu-fusion: True 
    no-bias-dropout-fusion: True 
    no-gradient-accumulation-fusion: True

###############################################################
# EXPERIMENT SECTION.
# Here we define the sweep, varying LR, BSZ, NODES, GPUS, and phases (stable, decay).
# We can set and refer to autoexp args, by prepending `autoexp.`.
# We can set and refer to slurm args, by prepending `slurm.`.
# We can set and refer to megatron args, by prepending `args.`.

experiments:

    autoexp.name: "debug_mock_data_01"

    args.lr: 5.e-4
    args.micro_batch_size: 16
    args.global_batch_size: 128

    slurm.gpus_per_node: 8
    slurm.nodes: 1
    slurm.partition: dev-g

    args.lr_wsd_decay_iters: 0
    args.train_iters: 2000
