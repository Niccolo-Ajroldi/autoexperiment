#
# 600M scaling experiment on Leonardo.
#

###############################################################
# AUTOEXP.
# Special variables used by autoexp.

autoexp:

    # Helpers and cluster setup script.
    oellm_folder: "/leonardo/home/userexternal/najroldi/oellm/dev/autoexperiment/oellm"
    helpers: "{oellm_folder}/helpers"
    cluster: "{oellm_folder}/cluster"

    # Output folder.
    out_folder: "/leonardo_work/OELLM_prod2026/users/najroldi/exp"
    logs: "{out_folder}/logs"
    ckpts: "{out_folder}/ckpts"
    scripts: "{out_folder}/sbatch"

    # Templated sbatch.
    template: "/leonardo/home/userexternal/najroldi/oellm/dev/autoexperiment/scripts/dense/leonardo/train.sbatch"

    # Destination for sbatch script and command to execute.
    sbatch_script: "{scripts}/{name}.sbatch"
    cmd: "sbatch {sbatch_script}"

    # Termination cmd.
    termination_cmd: "{helpers}/finished_train.py {logs} {slurm.job_name}"

###############################################################
# TEMPLATE ARGS.
# Placeholders in the templated sbatch.

slurm:

    job_name: "{autoexp.name}"
    out_dir: "{autoexp.logs}"
    ckpt_dir: "{autoexp.ckpts}"

    account: "OELLM_prod2026"
    partition: boost_usr_prod

    cluster_setup_script: "{autoexp.cluster}/setup_leonardo.sh"

###############################################################
# MEGATRON ARGS.
# These args are concatenated and passed verbatim to Megatron-LM.

args:

    # wandb name
    wandb_exp_name: "{autoexp.name}"
    wandb_project: dense_scaling

    # DATA
    data_path: [
      /leonardo_work/OELLM_prod2026/datasets/Nemotron-cc-2024-HQ-real-synth-mix/GPT-NeoX/merged_0,
      /leonardo_work/OELLM_prod2026/datasets/Nemotron-cc-2024-HQ-real-synth-mix/GPT-NeoX/merged_1,
      /leonardo_work/OELLM_prod2026/datasets/Nemotron-cc-2024-HQ-real-synth-mix/GPT-NeoX/merged_2,
      /leonardo_work/OELLM_prod2026/datasets/Nemotron-cc-2024-HQ-real-synth-mix/GPT-NeoX/merged_3,
      /leonardo_work/OELLM_prod2026/datasets/Nemotron-cc-2024-HQ-real-synth-mix/GPT-NeoX/merged_4,
      /leonardo_work/OELLM_prod2026/datasets/Nemotron-cc-2024-HQ-real-synth-mix/GPT-NeoX/merged_5  
    ]
    seq_length: 4096
    max_position_embeddings: 4096
    vocab_file: "/leonardo_work/OELLM_prod2026/models/EleutherAI/gpt-neox-20b/vocab.json"
    merge_file: "/leonardo_work/OELLM_prod2026/models/EleutherAI/gpt-neox-20b/merges.txt"
    num_workers: 8
    split: '99,1,0'

    # MODEL: 600M
    num_layers: 22
    hidden_size: 1280
    ffn_hidden_size: 5120
    num_attention_heads: 20
    num_query_groups: "{args.num_attention_heads}" # no gqa when NUM_QUERY_GROUPS==NUM_ATTENTION_HEADS TODO: check
    group_query_attentions: False
    init_method_std: 0.02
    position_embedding_type: "rope"
    rotary_base: 10000
    rotary_percent: 1.0
    attention_dropout: 0.0
    hidden_dropout: 0.0
    normalization: RMSNorm
    norm_epsilon: 1.e-5 # rmsnorm epsilon
    qk_layernorm: True # enable qk-norm
    bf16: True
    swiglu: True
    untie_embeddings_and_output_weights: False
    use_flash_attn: True
    attention_softmax_in_fp32: False # OpenSci style
    disable_bias_linear: False

    # TRAINING, PARALLELISM
    recompute_activations: False
    use_torch_fsdp2: False # it's either this or the next 4 args
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: True

    distributed_backend: nccl
    distributed_timeout_minutes: 10

    # DISTRIBUTED OPTIM
    use_distributed_optimizer: True

    # OPTIMIZER
    optimizer: adam
    adam_beta1: 0.9
    adam_beta2: 0.95 # TODO: Adpat it to the model size!
    adam_eps: 1.e-8
    clip_grad: 1.0
    weight_decay: 0.1

    # SCHEDULER
    min_lr: 1.e-5
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_warmup_iters: 2000

    # PROFILE
    profile: False
    use_pytorch_profiler: False

    # EVALS
    eval_interval: 5000
    eval_iters: 100 # Megatron default

    # LOGGING
    log_interval: 1
    log_progress: True
    log_throughput: True

    # Set CHECKPOINT_FORMAT
    ckpt_format: "torch" # "torch_dist" is bugged, TODO: fix
    save_interval: 5000


###############################################################
# EXPERIMENT SECTION.
# Here we define the sweep, varying LR, BSZ, NODES, GPUS, and phases (stable, decay).
# We can set and refer to autoexp args, by prepending `autoexp.`.
# We can set and refer to slurm args, by prepending `slurm.`.
# We can set and refer to megatron args, by prepending `args.`.

experiments:

    # Batch size per gpu.
    args.micro_batch_size: 16

    # Learning rate sweep.
    args.lr: [0.0001, 0.0003, 0.0009, 0.0027]

    # Sweep over global batch sizes and corresponding nodes/gpus.
    sweep:
        - full_node:
            args.global_batch_size: [64, 128, 256, 512]
            slurm.gpus_per_node: 4
            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"

        - half_node:
            args.global_batch_size: 32
            slurm.gpus_per_node: 2
            slurm.nodes: 1

    # Train iters computed from tokens.
    args.train_iters: "expr(({tokens} + {args.seq_length} * {args.global_batch_size} - 1) // ({args.seq_length} * {args.global_batch_size}))"

    # Cooldown: 20% of train iters.
    decay_fraction: 0.2
    args.lr_wsd_decay_iters: "expr(int({args.train_iters} * {decay_fraction}))"

    # A base name common to all phases.
    base_name: "600M_lr{args.lr}_gbsz{args.global_batch_size}"

    # Phase-specific name.
    autoexp.name: "{base_name}_{label}"

    # A long 300BT run and intermediate decays.
    phase:

        - longest:
            label: 300B
            tokens: 300_000_000_000

        - decays:
            scale:
                - 6B:
                    label: 6B
                    tokens: 6_000_000_000
                - 12B:
                    label: 12B
                    tokens: 12_000_000_000
                - 20B:
                    label: 20B
                    tokens: 20_000_000_000
                - 30B:
                    label: 30B
                    tokens: 30_000_000_000
                - 50B:
                    label: 50B
                    tokens: 50_000_000_000
                - 80B:
                    label: 80B
                    tokens: 80_000_000_000
                - 120B:
                    label: 120B
                    tokens: 120_000_000_000
                - 200B:
                    label: 200B
                    tokens: 200_000_000_000

            # Cooldown 20%, start cooldown at 80% of train_iters.
            decay_fraction: 0.2
            start_iter: "expr(int({args.train_iters} * (1 - {decay_fraction})))"
            # Round down to a multiple of save_interval.
            start_iter_round: "expr(int(({start_iter} + {args.save_interval} // 2) // {args.save_interval} * {args.save_interval}))"

            # Start decay when the long run has reached start_iter.
            autoexp.start_condition_cmd: "{autoexp.helpers}/pending_cooldown.py \
                {autoexp.ckpts} {base_name}_300B {autoexp.name} {start_iter_round}"

            # Override the LR Scheduler in the decay phase.
            args.override_opt_param_scheduler: True
