#
# 50M scaling experiment on LUMI.
#

###############################################################
# AUTOEXP.
# Special variables used by autoexp.

autoexp:

    # Helpers and cluster setup script.
    oellm_folder: "/scratch/project_462000963/users/niccolo/autoexperiment/oellm"
    helpers: "{oellm_folder}/helpers"
    cluster: "{oellm_folder}/cluster"

    # Output folder for logs, checkpoints, sbatch scripts.
    out_folder: "/scratch/project_462000963/users/niccolo/oellm_scaling"
    logs: "{out_folder}/logs"
    ckpts: "{out_folder}/ckpts"
    scripts: "{out_folder}/sbatch"

    # Templated sbatch.
    template: "/scratch/project_462000963/users/niccolo/autoexperiment/scripts/dense/xmas/template.sbatch"

    # Destination for sbatch script and command to execute.
    sbatch_script: "{scripts}/{name}.sbatch"
    cmd: "sbatch {sbatch_script}"

    # Termination cmd.
    termination_cmd: "{helpers}/finished_train.py {logs} {slurm.job_name}"

###############################################################
# TEMPLATE ARGS.
# Placeholders in the templated sbatch.

slurm:

    job_name: "{autoexp.name}"
    out_dir: "{autoexp.logs}"
    ckpt_dir: "{autoexp.ckpts}"

    account: "project_462000963"

    cluster_setup_script: "{autoexp.cluster}/setup_lumi.sh"

    # Wandb exp name is modified by the sbatch template, 
    # where SLURM_JOB_ID is appended to it, and then passed to megatron args.
    wandb_exp_name: "{autoexp.name}"

###############################################################
# MEGATRON ARGS.
# These args are concatenated and passed verbatim to Megatron-LM.

args:

    wandb_project: dense_scaling

    # DATA
    # data_path: /pfs/lustrep4/scratch/project_462000963/preprocessed/gpt-neox-20b/nemotron-cc/1.0/downsampled_15p/merged_all/high-all
    data_path: /flash/project_462000963/users/niccolo/copy_nemotron_downsampled_15p/high-all
    seq_length: 4096
    max_position_embeddings: 4096
    tokenizer_model: EleutherAI/gpt-neox-20b
    tokenizer_type: HuggingFaceTokenizer
    num_workers: 7
    num-dataset-builder-threads: 6 # lumi-specific
    split: '99,1,0'

    # MODEL: 50M
    num_layers: 12
    hidden_size: 384
    ffn_hidden_size: 1536
    num_attention_heads: 6
    num_query_groups: "{args.num_attention_heads}" # no gqa when NUM_QUERY_GROUPS==NUM_ATTENTION_HEADS
    group_query_attentions: False
    init_method_std: 0.02
    position_embedding_type: "rope"
    rotary_base: 10000
    rotary_percent: 1.0
    attention_dropout: 0.0
    hidden_dropout: 0.0
    normalization: RMSNorm
    norm_epsilon: 1.e-5 # rmsnorm epsilon
    qk_layernorm: True # enable qk-norm
    bf16: True
    swiglu: True
    untie_embeddings_and_output_weights: False
    use_flash_attn: True
    attention_softmax_in_fp32: False # OpenSci style
    disable_bias_linear: False

    # TRAINING, PARALLELISM
    recompute_activations: False
    use_torch_fsdp2: False # it's either this or the next 4 args
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: True

    distributed_backend: nccl
    distributed_timeout_minutes: 10

    # DISTRIBUTED OPTIM
    use_distributed_optimizer: True

    # OPTIMIZER
    optimizer: adam
    adam_beta1: 0.9
    adam_beta2: 0.99 # 0.99 for models up to 130M, then 0.95
    adam_eps: 1.e-8
    clip_grad: 1.0
    weight_decay: 0.1

    # SCHEDULER
    min_lr: 1.e-5
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_warmup_iters: 2000 # Fixed for all.

    # PROFILE
    profile: False
    use_pytorch_profiler: False

    # EVALS
    # Eval interval scales inversely with global batch size,
    # calibrated so that gbsz=1024 evals every 200 iterations.
    eval_interval: "expr(204800 // {args.global_batch_size})"
    eval_iters: 100 # default

    # LOGGING
    log_interval: 10
    log_progress: True
    log_throughput: True

    # Set CHECKPOINT_FORMAT
    ckpt_format: "torch"
    # Checkpoint interval scales inversely with global batch size,
    # calibrated so that gbsz=1024 saves every 500 iterations.
    save_interval: "expr(512000 // {args.global_batch_size})"

    # LUMI-specific configs
    te-fallback-layernorm-linear: True
    no-bias-swiglu-fusion: True 
    no-bias-gelu-fusion: True
    no-bias-dropout-fusion: True 
    no-gradient-accumulation-fusion: True

###############################################################
# EXPERIMENT SECTION.
# Here we define the sweep, varying LR, BSZ, NODES, GPUS, and phases (stable, decay).
# We can set and refer to autoexp args, by prepending `autoexp.`.
# We can set and refer to slurm args, by prepending `slurm.`.
# We can set and refer to megatron args, by prepending `args.`.

experiments:

    # Batch size per gpu.
    args.micro_batch_size: 16

    # Learning rate sweep.
    args.lr: [0.0005, 0.001, 0.002, 0.004, 0.008]

    # Train iters from tokens
    args.train_iters: "expr(({tokens} + {args.seq_length} * {args.global_batch_size} - 1) // ({args.seq_length} * {args.global_batch_size}))"

    # Cooldown 20%
    decay_fraction: 0.2
    args.lr_wsd_decay_iters: "expr(int({args.train_iters} * {decay_fraction}))"

    # A base name common to all phases.
    base_name: "dense_50M_xm01_lr{args.lr}_gbsz{args.global_batch_size}_beta2{args.adam_beta2}"

    # Phase-specific name.
    autoexp.name: "{base_name}_{label}"

    # A long 300BT run and intermediate decays.
    phase:

        - longest:

            tokens: 300_000_000_000
            label: "300B"

            bsz_sweep:
                - full_node:
                    args.global_batch_size: [128, 256, 512, 1024]
                    slurm.gpus_per_node: 8
                    slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                    slurm.partition: standard-g
                - half_node:
                    args.global_batch_size: 64
                    slurm.gpus_per_node: 4
                    slurm.nodes: 1
                    slurm.partition: small-g

            # We need to ensure a checkpoint is saved before each cooldown.
            # Save before each decay phase starts, at iteration decay_iters * (1 - decay_fraction)
            seq_len: "{args.seq_length}"
            gbsz: "{args.global_batch_size}"
            args.save_extra_steps: "expr(' '.join(map(str, [
                    int(((6e9   + {seq_len}*{gbsz} - 1) // ({seq_len}*{gbsz})) * (1-{decay_fraction})),
                    int(((12e9  + {seq_len}*{gbsz} - 1) // ({seq_len}*{gbsz})) * (1-{decay_fraction})),
                    int(((20e9  + {seq_len}*{gbsz} - 1) // ({seq_len}*{gbsz})) * (1-{decay_fraction})),
                    int(((30e9  + {seq_len}*{gbsz} - 1) // ({seq_len}*{gbsz})) * (1-{decay_fraction})),
                    int(((50e9  + {seq_len}*{gbsz} - 1) // ({seq_len}*{gbsz})) * (1-{decay_fraction})),
                    int(((80e9  + {seq_len}*{gbsz} - 1) // ({seq_len}*{gbsz})) * (1-{decay_fraction})),
                    int(((120e9 + {seq_len}*{gbsz} - 1) // ({seq_len}*{gbsz})) * (1-{decay_fraction})),
                    int(((200e9 + {seq_len}*{gbsz} - 1) // ({seq_len}*{gbsz})) * (1-{decay_fraction})),
                ])) )"

        - intermediate_decays:

            # Decay happens only if warmup iterations is < 30% of train iters.
            # Hence, only some batch sizes are valid for each decay budget.
            scale:
                - 6B:
                    label: "6B"
                    tokens: 6_000_000_000
                    bsz_sweep:
                        - full_node:
                            args.global_batch_size: 128
                            slurm.gpus_per_node: 8
                            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                            slurm.partition: standard-g
                        - half_node:
                            args.global_batch_size: 64
                            slurm.gpus_per_node: 4
                            slurm.nodes: 1
                            slurm.partition: small-g
                - 12B:
                    label: "12B"
                    tokens: 12_000_000_000
                    bsz_sweep:
                        - full_node:
                            args.global_batch_size: [128, 256]
                            slurm.gpus_per_node: 8
                            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                            slurm.partition: standard-g
                        - half_node:
                            args.global_batch_size: 64
                            slurm.gpus_per_node: 4
                            slurm.nodes: 1
                            slurm.partition: small-g
                - 20B:
                    label: "20B"
                    tokens: 20_000_000_000
                    bsz_sweep:
                        - full_node:
                            args.global_batch_size: [128, 256, 512]
                            slurm.gpus_per_node: 8
                            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                            slurm.partition: standard-g
                        - half_node:
                            args.global_batch_size: 64
                            slurm.gpus_per_node: 4
                            slurm.nodes: 1
                            slurm.partition: small-g
                - 30B:
                    label: "30B"
                    tokens: 30_000_000_000
                    bsz_sweep:
                        - full_node:
                            args.global_batch_size: [128, 256, 512, 1024]
                            slurm.gpus_per_node: 8
                            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                            slurm.partition: standard-g
                        - half_node:
                            args.global_batch_size: 64
                            slurm.gpus_per_node: 4
                            slurm.nodes: 1
                            slurm.partition: small-g
                - 50B:
                    label: "50B"
                    tokens: 50_000_000_000
                    bsz_sweep:
                        - full_node:
                            args.global_batch_size: [128, 256, 512, 1024]
                            slurm.gpus_per_node: 8
                            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                            slurm.partition: standard-g
                        - half_node:
                            args.global_batch_size: 64
                            slurm.gpus_per_node: 4
                            slurm.nodes: 1
                            slurm.partition: small-g
                - 80B:
                    label: "80B"
                    tokens: 80_000_000_000
                    bsz_sweep:
                        - full_node:
                            args.global_batch_size: [128, 256, 512, 1024]
                            slurm.gpus_per_node: 8
                            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                            slurm.partition: standard-g
                        - half_node:
                            args.global_batch_size: 64
                            slurm.gpus_per_node: 4
                            slurm.nodes: 1
                            slurm.partition: small-g
                - 120B:
                    label: "120B"
                    tokens: 120_000_000_000
                    bsz_sweep:
                        - full_node:
                            args.global_batch_size: [128, 256, 512, 1024]
                            slurm.gpus_per_node: 8
                            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                            slurm.partition: standard-g
                        - half_node:
                            args.global_batch_size: 64
                            slurm.gpus_per_node: 4
                            slurm.nodes: 1
                            slurm.partition: small-g
                - 200B:
                    label: "200B"
                    tokens: 200_000_000_000
                    bsz_sweep:
                        - full_node:
                            args.global_batch_size: [128, 256, 512, 1024]
                            slurm.gpus_per_node: 8
                            slurm.nodes: "expr({args.global_batch_size} // ({args.micro_batch_size} * {slurm.gpus_per_node}))"
                            slurm.partition: standard-g
                        - half_node:
                            args.global_batch_size: 64
                            slurm.gpus_per_node: 4
                            slurm.nodes: 1
                            slurm.partition: small-g

            # Cooldown 20%, start cooldown at 80% of train_iters.
            start_iter: "expr(int({args.train_iters} * (1 - {decay_fraction})))"

            # Start intermediate decay when the long run has reached start_iter.
            autoexp.start_condition_cmd: "{autoexp.helpers}/pending_cooldown.py \
                {autoexp.ckpts} {base_name}_300B {autoexp.name} {start_iter}"

            # Override the LR Scheduler in the decay phase.
            args.override_opt_param_scheduler: True
